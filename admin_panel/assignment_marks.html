<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Assignment Marks - EduNest Admin</title>
  <link rel="stylesheet" href="style.css?v=1.2">
  <link rel="stylesheet" href="mobile-nav.css?v=1.2">
  <link rel="stylesheet" href="assignment_marks.css?v=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabaseClient.js?v=1.2"></script>
  <script src="supabaseAdmin.js?v=1.2"></script>
</head>
<body>
  <div class="main-bg"></div>
  
  <!-- Header -->
  <header class="header" style="background: linear-gradient(120deg,#6366f1 0%,#60a5fa 50%,#a78bfa 100%); box-shadow: 0 4px 24px rgba(99,102,241,0.13); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; position: relative; z-index: 10;">
    <div class="header-content">
      <div class="appbar-top-row">
        <div class="appbar-title-center">
          <span class="page-title">Assignment Marks</span>
        </div>
        <div class="appbar-right">
          <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
        </div>
      </div>
      <div class="class-context-card">
        <span id="contextClass" class="context-line class-name">Loading Class...</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <!-- Loading State -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Loading students and assignments...</p>
    </div>

    <!-- Assignment Marks Section -->
    <div id="assignmentSection" class="section hidden">
      <div class="section-header">
        <h2>📝 Student Assignment Marks</h2>
        <div class="header-buttons">
          <button class="btn btn-secondary" onclick="showDeleteAssignmentModal()" style="margin-right: 0.5rem;">
            <span>🗑️ Delete Assignment</span>
          </button>
          <button class="btn btn-primary" onclick="showAddAssignmentModal()">
            <span>+ Add Assignment</span>
          </button>
        </div>
      </div>

      <!-- Assignment Marks Table -->
      <div class="marks-table-container">
        <div class="marks-table-wrapper">
          <table id="marksTable" class="marks-table">
            <thead>
              <tr>
                <th class="student-column">Student Details</th>
                <th id="noAssignmentsHeader" class="no-data">No Assignments Created</th>
                <!-- Assignment columns will be added dynamically -->
              </tr>
            </thead>
            <tbody id="marksTableBody">
              <!-- Student rows will be populated here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="table-actions">
        <button class="btn btn-secondary" onclick="exportToCSV()">
          📊 Export to CSV
        </button>
        <button class="btn btn-primary" onclick="saveAllMarks()">
          💾 Save All Changes
        </button>
      </div>

      <!-- No Students State -->
      <div id="noStudentsState" class="empty-state hidden">
        <div class="empty-icon">👥</div>
        <h3>No Students Enrolled</h3>
        <p>No students are enrolled in this class yet.</p>
      </div>
    </div>
  </div>

  <!-- Add Assignment Modal -->
  <div id="addAssignmentModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Add New Assignment</h3>
        <button class="modal-close" onclick="hideAddAssignmentModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="addAssignmentForm">
          <div class="form-group">
            <label for="assignmentTitle">Assignment Title</label>
            <input type="text" id="assignmentTitle" placeholder="e.g., Assignment 1, Project Report" required>
          </div>
          <div class="form-group">
            <label for="maxMarks">Maximum Marks</label>
            <input type="number" id="maxMarks" min="1" max="1000" value="100" required>
          </div>
          <div class="form-group">
            <label for="assignmentDescription">Description (Optional)</label>
            <textarea id="assignmentDescription" placeholder="Assignment description" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="hideAddAssignmentModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" onclick="createAssignment()">Create Assignment</button>
      </div>
    </div>
  </div>

  <!-- Mark Students Modal -->
  <!-- Removed - using table layout instead -->

  <!-- Message Display -->
  <div id="messageDisplay" class="message"></div>

  <script src="assignment_marks.js?v=1.0"></script>
</body>
</html>
