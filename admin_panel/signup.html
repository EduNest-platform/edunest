<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EduNest Admin Signup</title>
  <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>
  <div class="main-bg"></div>
  <div id="signupPage" class="login-page">
    <div class="login-card">
      <div class="logo-large">🎓</div>
      <h1 class="login-title">EduNest Admin</h1>
      <p class="login-subtitle">Create Admin Account</p>
      <form id="signupForm">
        <input id="signupEmail" type="email" placeholder="Admin Email" required />
        <input id="signupPassword" type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <div id="signupError" class="error-msg"></div>
      <div style="margin-top:10px; color:#667eea; text-align:center; font-size:1em;">
        Already have an account? <a href="index.html" style="text-decoration:underline; color:#667eea;">Login</a>
      </div>
    </div>
  </div>
  <!-- Email verification dialog -->
  <div id="verifyDialog" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.35); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:18px; max-width:350px; margin:auto; padding:32px 24px; box-shadow:0 8px 32px #667eea33; text-align:center;">
      <div style="font-size:2.2em; margin-bottom:12px;">📧</div>
      <div style="font-size:1.25em; font-weight:700; color:#232946; margin-bottom:10px;">Check your inbox</div>
      <div style="font-size:1.05em; color:#444; margin-bottom:18px;">We've sent a verification link to your email. Please verify your email to activate your admin account.</div>
      <button id="goToLoginBtn" style="background:linear-gradient(90deg,#667eea 60%,#764ba2 100%);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:1.08em;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #667eea22;">Go to Login</button>
    </div>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="supabaseAdmin.js"></script>
  <script src="authManager.js?v=1.0"></script>
</body>
</html>
