<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>My College - EduNest Admin</title>
  <link rel="stylesheet" href="colleges.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabaseClient.js"></script>
  <script src="supabaseAdmin.js"></script>
</head>
<body>
  <div class="main-bg"></div>
  
  <!-- Header -->
  <header class="header" style="background: linear-gradient(120deg,#6366f1 0%,#60a5fa 50%,#a78bfa 100%); box-shadow: 0 4px 24px rgba(99,102,241,0.13); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; position: relative; z-index: 10;">
    <div class="header-content" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 6vw 20px 6vw; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; gap: 12px;">
      <!-- Brand/Logo -->
      <div class="brand" style="display: flex; align-items: center; gap: 10px; min-width: 120px;">
        <span class="appbar-logo" style="font-size: 2em; filter: drop-shadow(0 2px 8px #818cf8aa);">🏫</span>
        <span class="appbar-appname" style="font-size: 1.5em; font-weight: 900; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 8px #6366f1aa; font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;">EduNest</span>
      </div>
      <!-- Centered Title -->
      <div class="center-title" style="flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0;">
        <span class="page-title" style="font-size: 1.7em; font-weight: 800; color: #fff; letter-spacing: 0.5px; text-shadow: 0 2px 8px #6366f1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">My College</span>
      </div>
      <!-- Back Button -->
      <div class="back-btn-wrap" style="display: flex; align-items: center; min-width: 80px; justify-content: flex-end;">
        <a href="dashboard.html" class="back-btn" style="background: rgba(255,255,255,0.85); color: #6366f1; border-radius: 8px; padding: 7px 16px; font-weight: 600; font-size: 1.05em; box-shadow: 0 2px 8px rgba(99,102,241,0.10); text-decoration: none; transition: background 0.2s, color 0.2s; border: none; outline: none; display: inline-flex; align-items: center; justify-content: center; min-width: 0;">Back</a>
      </div>
    </div>
    <style>
      @media (max-width: 700px) {
        .header-content {
          flex-direction: row !important;
          align-items: center !important;
          justify-content: space-between !important;
          padding: 8px 2vw 8px 2vw !important;
          gap: 0 !important;
        }
        .brand {
          gap: 6px !important;
        }
        .appbar-logo {
          font-size: 1.2em !important;
          margin-right: 2px !important;
        }
        .appbar-appname {
          font-size: 1em !important;
        }
        .center-title {
          flex: 1 1 0%;
          min-width: 0;
          justify-content: center !important;
        }
        .page-title {
          font-size: 1em !important;
          font-weight: 700 !important;
          margin: 0 !important;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .back-btn-wrap {
          min-width: 0 !important;
        }
        .back-btn {
          font-size: 0.98em !important;
          padding: 6px 12px !important;
          border-radius: 7px !important;
          min-width: 0 !important;
          width: auto !important;
          margin: 0 !important;
        }
      }
    </style>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Admin Info Header -->
    <div style="background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2em; font-weight: bold;" id="adminAvatar">A</div>
        <div>
          <div style="color: #6b7280; font-size: 0.9em;" id="adminEmail">Loading...</div>
          <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; font-weight: 600; display: inline-block;" id="adminRole">Loading...</div>
        </div>
      </div>
    </div>

    <!-- College Display Section -->
    <section class="college-section">
      <div class="section-header">
        <h2>🏫 My Assigned College</h2>
        <p>College you are managing</p>
      </div>
      
      <div id="collegeDisplay" class="college-display">
        <!-- College information will be loaded here -->
      </div>
    </section>
  </main>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p>Loading...</p>
  </div>

  <script src="login.js"></script>
  <script src="colleges.js"></script>
</body>
</html>
