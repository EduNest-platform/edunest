<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Question Entry - EduNest Admin</title>
  <link rel="stylesheet" href="question_entry.css">
</head>
<body>
  <div class="main-bg"></div>
  
  <header class="header" style="background: linear-gradient(120deg,#6366f1 0%,#60a5fa 50%,#a78bfa 100%); box-shadow: 0 4px 24px rgba(99,102,241,0.13); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; position: relative; z-index: 10;">
    <div class="header-content">
      <div class="appbar-top-row">
        <div class="appbar-left">
          <span class="appbar-logo">🏫</span>
          <span class="appbar-appname">EduNest</span>
        </div>
        <div class="appbar-title-center">
          <span class="page-title">Manual Question Entry</span>
          <div class="college-branch-card">
            <span id="contextCollege" class="college-branch-line college-name">College</span>
            <span id="contextBranch" class="college-branch-line branch-name">Branch</span>
            <span id="contextSemester" class="college-branch-line semester-name">Semester</span>
          </div>
        </div>
        <div class="appbar-right">
          <a href="dashboard.html" class="back-btn">
            <span class="back-btn-text-full">Back to Dashboard</span>
            <span class="back-btn-text-short">Back</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content modern-bg">
    <!-- Test Configuration Section -->
    <section class="test-config-section modern-card">
      <div class="section-header">
        <h3>📝 Test Configuration</h3>
        <p>Configure your test settings before adding questions</p>
      </div>
      
      <div class="config-grid">
        <div class="form-group">
          <label for="testNameInput">Test Name *</label>
          <input type="text" id="testNameInput" required placeholder="e.g., Unit Test 1, Chapter 3 Quiz">
        </div>
        
        <div class="form-group">
          <label for="subjectInput">Subject *</label>
          <select id="subjectInput">
            <option value="">Loading subjects...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="numQuestionsInput">Number of Questions *</label>
          <input type="number" id="numQuestionsInput" min="1" max="50" value="15" required>
        </div>
        
        <div class="form-group">
          <label for="testDurationInput">Test Duration (minutes) *</label>
          <input type="number" id="testDurationInput" min="1" max="300" value="30" required>
        </div>
      </div>
      
      <div class="config-actions">
        <button id="startQuestionEntry" class="start-btn">Start Adding Questions</button>
      </div>
    </section>

    <!-- Question Entry Section -->
    <section class="question-entry-section modern-card" id="questionEntrySection" style="display:none;">
      <div class="section-header">
        <h3>❓ Question <span id="questionNumberLabel">1</span> of <span id="totalQuestionsLabel">15</span></h3>
        <div class="question-progress">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-text"><span id="currentQuestionNum">1</span>/<span id="totalQuestions">15</span></span>
        </div>
      </div>
      
      <form id="questionForm">
        <div class="form-group">
          <label for="questionText">Question Text *</label>
          <textarea id="questionText" required placeholder="Enter the question here..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Options *</label>
          <div class="options-list">
            <div class="option-item">
              <input type="radio" name="correctOption" value="A" id="optionA_radio" required>
              <input type="text" id="optionA" placeholder="Option A" required>
              <label for="optionA_radio">A</label>
            </div>
            <div class="option-item">
              <input type="radio" name="correctOption" value="B" id="optionB_radio">
              <input type="text" id="optionB" placeholder="Option B" required>
              <label for="optionB_radio">B</label>
            </div>
            <div class="option-item">
              <input type="radio" name="correctOption" value="C" id="optionC_radio">
              <input type="text" id="optionC" placeholder="Option C" required>
              <label for="optionC_radio">C</label>
            </div>
            <div class="option-item">
              <input type="radio" name="correctOption" value="D" id="optionD_radio">
              <input type="text" id="optionD" placeholder="Option D" required>
              <label for="optionD_radio">D</label>
            </div>
          </div>
        </div>
        
        <div class="form-actions">
          <button type="button" id="saveAndNextBtn" class="save-next-btn">Save & Next Question</button>
          <button type="button" id="finishTestBtn" class="finish-btn">Review & Submit</button>
        </div>
      </form>
      
      <div id="questionMsg" class="message"></div>
    </section>

    <!-- Review Section -->
    <section class="review-section modern-card" id="reviewSection" style="display:none;">
      <div class="section-header">
        <h3>🔍 Review All Questions</h3>
        <p>Check all your questions below, then submit to add them to the database</p>
      </div>
      
      <div id="reviewQuestionsList"></div>
      
      <div class="review-actions">
        <button id="backToQuestionsBtn" class="back-btn-secondary">Back to Edit</button>
        <button id="submitAllBtn" class="submit-btn">Submit to Database</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="question_entry.js"></script>
</body>
</html>
