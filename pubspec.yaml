name: edunest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.1
  provider: ^6.1.2
  url_launcher: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  syncfusion_flutter_pdfviewer: ^28.1.37
  table_calendar: ^3.0.9
  shared_preferences: ^2.5.3
  image_picker: ^1.0.7
  http: ^1.1.0
  crypto: ^3.0.3
  firebase_core: ^2.24.2
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.0.0
  window_manager: ^0.3.7
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/logo11.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo11.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/logo11.png"
  remove_alpha_ios: true
  image_path_ios: "assets/images/logo11.png"
