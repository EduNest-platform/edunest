<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management - EduNest Admin</title>
    <link rel="stylesheet" href="subjects.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body>
    <div class="main-bg"></div>
    
    <!-- Header -->
    <header class="header" style="background: linear-gradient(120deg,#6366f1 0%,#60a5fa 50%,#a78bfa 100%); box-shadow: 0 4px 24px rgba(99,102,241,0.13); border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; position: relative; z-index: 10;">
        <div class="header-content">
            <div class="appbar-top-row">
                <div class="appbar-left">
                    <span class="appbar-logo">🏫</span>
                    <span class="appbar-appname">EduNest</span>
                </div>
                <div class="appbar-title-center">
                    <span class="page-title">Subject Management</span>
                    <div class="college-branch-card">
                        <span id="contextCollege" class="college-branch-line college-name">All Colleges</span>
                        <span id="contextBranch" class="college-branch-line branch-name">All Branches</span>
                        <span id="contextSemester" class="college-branch-line semester-name">All Semesters</span>
                    </div>
                </div>
                <div class="appbar-right">
                    <a href="semesters.html" class="back-btn">Back</a>
                </div>
            </div>
        </div>
        <style>
            .header-content {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
                padding: 10px 3vw 6px 3vw;
                max-width: 1200px;
                margin: 0 auto;
                gap: 0;
            }
            .appbar-top-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                gap: 0;
            }
            .appbar-left {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 120px;
            }
            .appbar-logo {
                font-size: 1.3em;
                filter: drop-shadow(0 2px 8px #818cf8aa);
            }
            .appbar-appname {
                font-size: 1.1em;
                font-weight: 900;
                color: #fff;
                letter-spacing: 1px;
                text-shadow: 0 2px 8px #6366f1aa;
                font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            }
            .appbar-title-center {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-width: 0;
            }
            .page-title {
                font-size: 2em;
                font-weight: 900;
                color: #fff;
                letter-spacing: 0.5px;
                text-shadow: 0 2px 8px #6366f1aa;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                text-align: center;
                max-width: 70vw;
            }
            .appbar-right {
                display: flex;
                align-items: center;
                min-width: 80px;
                justify-content: flex-end;
            }
            .back-btn {
                background: rgba(255,255,255,0.85);
                color: #6366f1;
                border-radius: 8px;
                padding: 5px 12px;
                font-weight: 600;
                font-size: 0.98em;
                box-shadow: 0 2px 8px rgba(99,102,241,0.10);
                text-decoration: none;
                transition: background 0.2s, color 0.2s;
                border: none;
                outline: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
            }
            .college-branch-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                background: linear-gradient(120deg,rgba(255,255,255,0.92) 60%,rgba(236,241,255,0.85) 100%);
                border-radius: 32px;
                border: 1.5px solid #e0e7ff;
                box-shadow: 0 6px 32px 0 #6366f133, 0 1.5px 8px #6366f122;
                backdrop-filter: blur(2.5px);
                padding: 10px 64px 8px 64px;
                min-width: 260px;
                max-width: 80vw;
                transition: box-shadow 0.18s, border 0.18s, background 0.18s;
                margin-top: 10px;
            }
            .college-branch-line {
                display: block;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 70vw;
            }
            .college-name {
                color: #6366f1;
                font-weight: 700;
                font-size: 1.18em;
                letter-spacing: 0.3px;
                margin-bottom: 7px;
                text-shadow: 0 1px 8px #6366f122;
            }
            .branch-name {
                color: #334155;
                font-weight: 600;
                font-size: 1.04em;
                letter-spacing: 0.1px;
                margin-top: 2px;
                margin-bottom: 7px;
                opacity: 0.92;
            }
            .semester-name {
                color: #0ea5e9;
                font-weight: 600;
                font-size: 1.04em;
                letter-spacing: 0.1px;
                margin-top: 2px;
                opacity: 0.92;
            }
            @media (max-width: 700px) {
                .appbar-left {
                    display: none;
                }
                .appbar-title-center {
                    flex: 1;
                    justify-content: center;
                    align-items: stretch;
                    width: 100%;
                }
                .page-title {
                    font-size: 1.15em;
                    max-width: 98vw;
                }
                .college-branch-card {
                    margin: 8px auto 0 auto;
                    width: 100%;
                    max-width: 98vw;
                    min-width: 0;
                    padding: 7px 8vw 7px 8vw;
                    border-radius: 18px;
                }
                .college-branch-line {
                    max-width: 90vw;
                }
                .college-name {
                    font-size: 1em;
                    margin-bottom: 3px;
                }
                .branch-name, .semester-name {
                    font-size: 0.95em;
                    margin-bottom: 3px;
                }
            }
            .appbar-title-center .college-branch-card {
                margin-top: 12px;
            }
        </style>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Add Subject Section -->
        <section class="add-section">
            <div class="section-header">
                <h2>Add New Subject</h2>
                <p>Create a new subject for a specific semester</p>
            </div>
            <form class="add-form" onsubmit="event.preventDefault(); addSubject();">
                <div class="form-group">
                    <label>Semester</label>
                    <div id="selectedSemesterDisplay" class="selected-semester-display">All Semesters</div>
                    <div id="syllabusTimetableBtnContainer" style="margin: 18px 0 0 0;"></div>
                </div>
                <div class="form-group">
                    <label for="subjectName">Subject Name *</label>
                    <input type="text" id="subjectName" placeholder="e.g., Mathematics, Physics, Computer Science" required>
                </div>
                <div class="form-group">
                    <label for="subjectCode">Subject Code (Optional)</label>
                    <input type="text" id="subjectCode" placeholder="e.g., CS101, MATH201">
                </div>
                <div class="form-group">
                    <label for="subjectDescription">Description (Optional)</label>
                    <textarea id="subjectDescription" placeholder="Brief description of the subject"></textarea>
                </div>
                <button type="submit" class="submit-btn">
                    <span class="btn-icon">➕</span>Add Subject
                </button>
            </form>
        </section>

        <!-- Subjects List Section -->
        <section class="list-section">
            <div class="section-header">
                <h2>All Subjects</h2>
                <p>Manage existing subjects across all semesters</p>
                <div class="list-stats">
                    <div class="stat-item">
                        <span class="stat-number" id="subjectCount">0</span>
                        <span class="stat-label">Total Subjects</span>
                    </div>
                </div>
                <div class="search-bar" style="margin-top:18px;">
                    <input type="text" id="subjectSearchInput" placeholder="Search subjects..." style="width:100%;max-width:340px;padding:10px 14px;border-radius:8px;border:1.5px solid #d1d5db;font-size:1em;" />
                </div>
            </div>
            <div class="list-container">
                <div id="emptyState" class="hidden"></div>
                <div id="subjectList"></div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Loading subjects...</p>
    </div>

    <script src="login.js"></script>
    <script src="subjects.js"></script>
    <script>
    // Add Manage Topics button logic after subjects are rendered
    function addManageTopicsButtons() {
      const subjectList = document.getElementById('subjectList');
      if (!subjectList) return;
      // Wait for subjects.js to render subjects, then add buttons
      const observer = new MutationObserver(() => {
        const cards = subjectList.querySelectorAll('.subject-card');
        cards.forEach(card => {
          if (!card.querySelector('.manage-topics-btn')) {
            const subjectId = card.querySelector('.subject-id')?.textContent?.replace('ID: ', '').trim();
            const subjectName = card.querySelector('.subject-name')?.textContent?.trim();
            if (subjectId && subjectName) {
              const btn = document.createElement('button');
              btn.className = 'action-btn manage-topics-btn';
              btn.textContent = '📚 Manage Topics';
              btn.onclick = () => {
                window.location.href = `topics.html?subject_id=${encodeURIComponent(subjectId)}&subject_name=${encodeURIComponent(subjectName)}`;
              };
              card.querySelector('.subject-actions').appendChild(btn);
            }
          }
        });
      });
      observer.observe(subjectList, { childList: true, subtree: true });
    }
    document.addEventListener('DOMContentLoaded', addManageTopicsButtons);
    </script>
</body>
</html>
