<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Rosters Management - Super Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-nav.css">
  <style>
    /* Additional styles for class roster management */
    .content-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      border-radius: 15px;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .page-subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      margin: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 0.5rem;
    }

    .stat-label {
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .filters-section {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    .filter-select, .filter-input {
      padding: 0.75rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: border-color 0.2s;
      cursor: pointer;
      background-color: white;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      position: relative;
      z-index: 1;
    }

    .filter-select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
    }

    .filter-select:focus, .filter-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .filter-select:hover {
      border-color: #cbd5e0;
    }

    /* Ensure dropdowns are above other elements */
    .filter-select {
      position: relative;
      z-index: 100;
    }

    .filter-select option {
      padding: 0.5rem;
      background: white;
      color: #374151;
    }

    .filter-select option:hover,
    .filter-select option:focus {
      background: #f3f4f6;
    }

    /* Additional mobile support for dropdowns */
    @media (max-width: 768px) {
      .filter-select {
        font-size: 16px; /* Prevents zoom on iOS */
        padding: 0.875rem;
      }
    }

    .classes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .class-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .class-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .class-header {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .class-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1f2937;
      margin: 0 0 0.5rem 0;
    }

    .class-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    .class-body {
      padding: 1.5rem;
    }

    .roster-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .roster-stat {
      text-align: center;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .roster-stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 0.25rem;
    }

    .roster-stat-label {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }

    .class-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-width: 120px;
    }

    .action-btn.primary {
      background: #667eea;
      color: white;
    }

    .action-btn.primary:hover {
      background: #5a67d8;
      transform: translateY(-1px);
    }

    .action-btn.secondary {
      background: #e2e8f0;
      color: #374151;
    }

    .action-btn.secondary:hover {
      background: #cbd5e0;
      transform: translateY(-1px);
    }

    .action-btn.danger {
      background: #ef4444;
      color: white;
    }

    .action-btn.danger:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      margin: 0 0 0.5rem 0;
      color: #374151;
    }

    .loading-state {
      text-align: center;
      padding: 3rem;
      color: #64748b;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin: 1rem 0;
      font-weight: 500;
      display: none;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #374151;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      position: relative;
      z-index: 10;
    }

    .back-btn:hover {
      background: #1f2937;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(55, 65, 81, 0.4);
    }

    .back-btn:active {
      transform: translateY(0);
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #64748b;
      padding: 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: #f1f5f9;
    }

    .students-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .students-table th,
    .students-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    .students-table th {
      background: #f8fafc;
      font-weight: 600;
      color: #374151;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-badge.connected {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.not-connected {
      background: #fef3c7;
      color: #92400e;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-overlay .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2e8f0;
      border-top: 5px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    .loading-overlay p {
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .content-wrapper {
        padding: 1rem;
      }

      .page-title {
        font-size: 2rem;
      }

      .classes-grid {
        grid-template-columns: 1fr;
      }

      .filters-grid {
        grid-template-columns: 1fr;
      }

      .class-actions {
        flex-direction: row;
        justify-content: center;
      }

      .action-btn {
        min-width: auto;
        flex: 1;
        max-width: 200px;
      }

      .modal-content {
        margin: 1rem;
        padding: 1.5rem;
      }

      .students-table {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-bg"></div>
  
  <!-- Back to Dashboard -->
  <div class="content-wrapper">
    <a href="dashboard.html" class="back-btn">
      ← Back to Dashboard
    </a>

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">
        📚 Class Rosters Management
      </h1>
      <p class="page-subtitle">
        View and manage all class rosters across professors and communities
      </p>
    </div>

    <!-- Message Display -->
    <div id="messageDisplay" class="message"></div>

    <!-- Statistics Row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="totalClasses">0</div>
        <div class="stat-label">Total Classes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalStudents">0</div>
        <div class="stat-label">Total Students</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="connectedStudents">0</div>
        <div class="stat-label">App Connected</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalProfessors">0</div>
        <div class="stat-label">Active Professors</div>
      </div>
    </div>

    <!-- Filters Section -->
    <div class="filters-section">
      <h3 style="margin: 0 0 1rem 0; color: #374151;">Filters</h3>
      <div class="filters-grid">
        <div class="filter-group">
          <label class="filter-label">Professor</label>
          <select id="professorFilter" class="filter-select">
            <option value="">All Professors</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">College</label>
          <select id="collegeFilter" class="filter-select">
            <option value="">All Colleges</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Branch</label>
          <select id="branchFilter" class="filter-select">
            <option value="">All Branches</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Semester</label>
          <select id="semesterFilter" class="filter-select">
            <option value="">All Semesters</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Subject</label>
          <input type="text" id="subjectFilter" class="filter-input" placeholder="Search subjects...">
        </div>
        <div class="filter-group">
          <label class="filter-label">Actions</label>
          <button onclick="clearFilters()" class="action-btn secondary" style="min-width: auto;">
            Clear Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Classes Grid -->
    <div id="classesContainer">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading classes...</p>
      </div>
    </div>
  </div>

  <!-- Student Details Modal -->
  <div id="studentModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Class Roster</h2>
        <button class="modal-close" onclick="closeStudentModal()">×</button>
      </div>
      <div id="modalContent">
        <!-- Student list will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p id="loadingText">Loading...</p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseAdmin.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="class_rosters.js"></script>
</body>
</html>
