<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Community Admins - Super Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      color: #232946;
    }
    .container {
      max-width: 700px;
      margin: 48px auto 0 auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(102,126,234,0.18), 0 2px 8px rgba(76, 61, 128, 0.09);
      padding: 40px 36px 36px 36px;
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 18px;
      background: linear-gradient(90deg, #e0e7ff 60%, #f8fafc 100%);
      border-radius: 18px;
      box-shadow: 0 4px 24px #667eea18;
      padding: 28px 24px 24px 24px;
      position: relative;
      flex-wrap: wrap;
    }
    .header-icon {
      background: linear-gradient(135deg, #667eea 60%, #764ba2 100%);
      color: #fff;
      border-radius: 50%;
      padding: 22px;
      font-size: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px #667eea33, 0 1.5px 4px #764ba233;
      min-width: 70px;
      min-height: 70px;
      max-width: 80px;
      max-height: 80px;
    }
    .header-title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header-title {
      color: #2d3a4a;
      font-size: 1.7em;
      font-weight: 800;
      margin: 0;
      letter-spacing: -1.2px;
      line-height: 1.1;
      text-shadow: 0 2px 8px #e0e7ff;
    }
    .header-subtitle {
      color: #667eea;
      font-size: 1.08em;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin-top: 2px;
    }
    .header-divider {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #667eea22 0%, #fff 100%);
      border-radius: 2px;
      box-shadow: 0 2px 8px #667eea11;
    }
    .back-btn {
      background: linear-gradient(90deg, #667eea 60%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 1.13em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px #667eea22;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.01em;
    }
    .back-btn:hover {
      background: linear-gradient(90deg, #5a67d8 60%, #6b47b6 100%);
      box-shadow: 0 4px 16px #667eea33;
    }
    .community-name {
      font-size: 1.18em;
      font-weight: 700;
      color: #4f46e5;
      margin-bottom: 18px;
      letter-spacing: 0.01em;
    }
    .add-admin-form {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      align-items: flex-end;
      background: linear-gradient(90deg, #e0e7ff 60%, #f8fafc 100%);
      border-radius: 14px;
      padding: 18px 18px 12px 18px;
      box-shadow: 0 2px 8px #e0e6ed;
      flex-wrap: wrap;
    }
    .add-admin-form input, .add-admin-form select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1.5px solid #bfc7e6;
      font-size: 1.08em;
      background: #f4f7fa;
      transition: border 0.2s, box-shadow 0.2s;
      flex: 1 1 200px;
      box-shadow: 0 1px 4px #e0e7ff33;
    }
    .add-admin-form input:focus, .add-admin-form select:focus {
      border: 1.5px solid #667eea;
      box-shadow: 0 0 0 2px #667eea22;
      outline: none;
    }
    .add-admin-form button {
      background: linear-gradient(90deg, #667eea 60%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 28px 12px 18px;
      font-size: 1.08em;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(102,126,234,0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.01em;
    }
    .add-admin-form button:hover {
      background: linear-gradient(90deg, #5a67d8 60%, #6b47b6 100%);
      box-shadow: 0 4px 16px #667eea33;
    }
    .admins-list {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .admin-card {
      background: linear-gradient(120deg, #f8fafc 60%, #e0e7ff 100%);
      border-radius: 16px;
      box-shadow: 0 2px 8px #e0e6ed, 0 1px 4px #667eea11;
      padding: 20px 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      border: 1.5px solid #e0e7ff;
      margin-bottom: 8px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .admin-card:hover {
      box-shadow: 0 6px 24px #667eea22, 0 2px 8px #764ba211;
      transform: translateY(-2px) scale(1.01);
      border: 1.5px solid #667eea44;
    }
    .admin-info {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .admin-email {
      font-size: 1.13em;
      font-weight: 700;
      color: #232946;
      word-break: break-all;
    }
    .admin-role {
      font-size: 1em;
      color: #667eea;
      font-weight: 600;
      margin-left: 0;
    }
    .admin-id {
      font-size: 0.95em;
      color: #bfc7e6;
      margin-left: 10px;
      word-break: break-all;
      display: inline;
    }
    .admin-actions {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-top: 8px;
    }
    .remove-btn, .role-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.95em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      letter-spacing: 0.01em;
      width: 48%;
      min-width: 120px;
      text-transform: uppercase;
    }
    .remove-btn {
      background: linear-gradient(90deg, #ef4444 60%, #f87171 100%);
      color: #fff;
    }
    .remove-btn:hover {
      background: linear-gradient(90deg, #f87171 60%, #ef4444 100%);
      box-shadow: 0 4px 16px #ef444433;
      transform: translateY(-2px);
    }
    .role-btn {
      background: linear-gradient(90deg, #6366f1 60%, #818cf8 100%);
      color: #fff;
    }
    .role-btn:hover {
      background: linear-gradient(90deg, #818cf8 60%, #6366f1 100%);
      box-shadow: 0 4px 16px #6366f133;
      transform: translateY(-2px);
    }
    @media (max-width: 900px) {
      .container { padding: 24px 20px; }
      .back-btn {
        font-size: 1.05em;
        padding: 10px 24px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .header { 
        padding: 20px 20px 20px 20px; 
        border-radius: 16px;
        gap: 16px;
      }
      .header-icon {
        font-size: 2.2em;
        padding: 18px;
        min-width: 60px;
        min-height: 60px;
        max-width: 70px;
        max-height: 70px;
      }
      .header-title {
        font-size: 1.5em;
      }
      .header-subtitle {
        font-size: 1.0em;
      }
      .community-name {
        font-size: 1.1em;
        margin-bottom: 16px;
      }
      .add-admin-form {
        padding: 16px 16px 12px 16px;
        border-radius: 12px;
      }
      .admin-card { 
        padding: 16px 10px 10px 10px; 
        border-radius: 14px;
        gap: 8px;
      }
      .admins-list { gap: 14px; }
      .admin-actions { gap: 8px; }
      .remove-btn, .role-btn { 
        width: 100%;
        min-width: 0;
        font-size: 1em;
        padding: 10px 0;
      }
      .admin-id {
        display: none;
      }
    }
    @media (max-width: 700px) {
      .container { padding: 12px 16px; }
      .back-btn {
        font-size: 1.0em;
        padding: 8px 20px;
        border-radius: 8px;
        margin-bottom: 16px;
        width: fit-content;
      }
      .header { 
        flex-direction: row;
        align-items: center;
        gap: 12px;
        padding: 16px 12px;
        border-radius: 12px;
        margin-bottom: 16px;
      }
      .header-icon {
        font-size: 1.8em;
        padding: 10px;
        min-width: 45px;
        min-height: 45px;
        max-width: 55px;
        max-height: 55px;
      }
      .header-title { 
        font-size: 1.2em; 
        margin-bottom: 2px;
      }
      .header-subtitle {
        font-size: 0.9em;
      }
      .community-name {
        font-size: 1.05em;
        margin-bottom: 14px;
      }
      .add-admin-form { 
        flex-direction: column; 
        align-items: stretch; 
        gap: 6px; 
        padding: 10px 10px 6px 10px;
        border-radius: 8px;
      }
      .add-admin-form input, .add-admin-form select {
        font-size: 0.9em;
        padding: 6px 8px;
        border-radius: 6px;
        min-height: 40px;
        flex: 1 1 auto;
        width: 100%;
      }
      .add-admin-form button {
        font-size: 0.95em;
        padding: 8px 16px;
        border-radius: 6px;
        min-height: 36px;
      }
      .admin-card { 
        padding: 12px 6px 8px 6px; 
        border-radius: 10px;
        gap: 6px;
      }
      .admins-list { gap: 10px; }
      .admin-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
      }
      .admin-email {
        font-size: 1em;
      }
      .admin-role {
        font-size: 0.92em;
      }
      .admin-actions { 
        flex-direction: column; 
        gap: 6px; 
        margin-top: 6px;
      }
      .remove-btn, .role-btn { 
        width: 100%;
        min-width: 0;
        font-size: 0.98em;
        padding: 9px 0;
      }
      .admin-id {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="communities.html" class="back-btn">← Back to Communities</a>
    <div class="header">
      <div class="header-icon">👤</div>
      <div class="header-title-group">
        <div class="header-title">Manage Community Admins</div>
        <div class="header-subtitle">Add, view, and manage admins for this community.</div>
      </div>
      <div class="header-divider"></div>
    </div>
    <div class="community-name" id="communityName">Community: ...</div>
    <form class="add-admin-form" id="addAdminForm">
      <input id="adminEmail" type="email" placeholder="Admin Email" required />
      <select id="adminRole" required>
        <option value="admin">Admin</option>
        <option value="moderator">Moderator</option>
        <option value="professor">Professor</option>
      </select>
      <button type="submit"><span>➕</span> Add Admin</button>
    </form>
    <div id="adminMessage" class="message"></div>
    <div class="admins-list" id="adminsList">
      <!-- Admin cards will be rendered here by JS -->
    </div>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseAdmin.js"></script>
  <script src="community_admins.js"></script>
</body>
</html>
