<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feedback | EduNest Super Admin</title>
  <link rel="stylesheet" href="style.css?v=1.2">
  <link rel="stylesheet" href="mobile-nav.css?v=1.2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabaseClient.js?v=1.2"></script>
</head>
<body>
  <div class="main-bg"></div>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">🎓<span>EduNest</span></div>
      <nav class="sidebar-nav">
        <button class="nav-btn" onclick="window.location.href='dashboard.html'"><span class="nav-icon">📊</span> Overview</button>
        <button class="nav-btn" onclick="window.location.href='colleges.html'"><span class="nav-icon">🏗️</span> Hierarchy</button>
        <button class="nav-btn" onclick="window.location.href='ai-config.html'"><span class="nav-icon">🤖</span> AI Config</button>
        <button class="nav-btn" onclick="window.location.href='question_entry.html'"><span class="nav-icon">📝</span> Manual Question Entry</button>
        <button class="nav-btn" onclick="window.location.href='assigned_tests.html'"><span class="nav-icon">📊</span> Assigned Tests</button>
        <button class="nav-btn" onclick="window.location.href='communities.html'"><span class="nav-icon">🌐</span> Manage Communities</button>
        <button class="nav-btn" onclick="window.location.href='user_change_password.html'"><span class="nav-icon">🔒</span> Change User Password</button>
        <button class="nav-btn active" onclick="window.location.href='feedback.html'"><span class="nav-icon">💬</span> Feedback</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info modern-user-card">
          <div class="user-avatar">
            <span class="avatar-circle">S</span>
          </div>
          <div class="user-details">
            <div class="user-name">Super Admin</div>
            <div class="user-role">Super Administrator</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <section class="content-section">
        <div class="header feedback-header" style="background: linear-gradient(135deg, #6366f1 60%, #a5b4fc 100%); color: #fff; border-radius: 18px; box-shadow: 0 8px 32px rgba(99,102,241,0.13); margin-bottom: 32px; padding: 32px 24px 24px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; position: relative;">
          <button class="back-btn-mobile" onclick="window.location.href='dashboard.html'" aria-label="Back to Dashboard" style="display:none; position:absolute; left:12px; top:12px; background:rgba(255,255,255,0.18); border:none; border-radius:8px; padding:8px 14px; color:#fff; font-size:1.1em; font-weight:600; cursor:pointer; z-index:2;">
            ← Dashboard
          </button>
          <div class="logo" style="font-size: 2.5em; background: rgba(255,255,255,0.13); border-radius: 12px; padding: 12px 18px; color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.08);">💬</div>
          <div class="title-group">
            <h1 style="color: #fff; margin: 0;">Feedback</h1>
            <div class="subtitle" style="color: #e0e7ff;">View all feedback submitted by users</div>
          </div>
        </div>
        <div id="feedbackMsg" class="message" style="margin-bottom: 18px;"></div>
        <div class="card feedback-card" style="background: linear-gradient(135deg, #f8fafc 60%, #e0e7ff 100%); border-radius: 18px; box-shadow: 0 8px 32px rgba(99,102,241,0.10); padding: 0; overflow-x: auto;">
          <div id="loadingFeedback" class="message" style="margin: 24px;">Loading feedback...</div>
          <table id="feedbackTable" class="feedback-table" style="width:100%; display:none; background: #fff; border-radius: 14px; margin: 0;">
            <thead>
              <tr>
                <th style="min-width: 40px;">#</th>
                <th style="min-width: 90px;">Type</th>
                <th style="min-width: 120px;">Title</th>
                <th style="min-width: 260px; width: 38vw;">Description</th>
                <th style="min-width: 120px;">User Email</th>
                <th style="min-width: 120px;">Created At</th>
              </tr>
            </thead>
            <tbody id="feedbackTableBody">
              <!-- Feedback rows will be inserted here -->
            </tbody>
          </table>
        </div>
      </section>
      <footer class="footer">
        <div class="footer-content">
          <div class="footer-left">
            <span class="footer-logo">🎓 EduNest</span>
            <span class="footer-text">Super Admin Panel &copy; 2025</span>
          </div>
        </div>
      </footer>
    </main>
  </div>
  <script>
    const typeIcons = {
      bug: '🐞',
      suggestion: '💡',
      question: '❓',
      praise: '🎉',
      other: '📝'
    };
    async function loadFeedback() {
      document.getElementById('loadingFeedback').style.display = '';
      document.getElementById('feedbackTable').style.display = 'none';
      document.getElementById('feedbackMsg').textContent = '';
      try {
        const { data, error } = await window.supabaseClient.from('feedback').select('*').order('created_at', { ascending: false });
        const tbody = document.getElementById('feedbackTableBody');
        tbody.innerHTML = '';
        if (error) throw error;
        if (data && data.length > 0) {
          data.forEach((fb, i) => {
            const tr = document.createElement('tr');
            const icon = typeIcons[fb.type?.toLowerCase()] || typeIcons.other;
            tr.innerHTML = `
              <td style="font-weight:600; color:#6366f1;">${i+1}</td>
              <td style="font-size:1.3em;">${icon} <span style='font-size:0.85em; color:#64748b; margin-left:6px;'>${escapeHtml(fb.type)}</span></td>
              <td style="font-weight:600; color:#3730a3;">${escapeHtml(fb.title)}</td>
              <td style="max-width:520px; min-width:180px; color:#334155; word-break:break-word;">${escapeHtml(fb.description)}</td>
              <td style="color:#6366f1;">${fb.user_email ? escapeHtml(fb.user_email) : ''}</td>
              <td style="color:#64748b;">${new Date(fb.created_at).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          });
          document.getElementById('feedbackTable').style.display = '';
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="color:#64748b; text-align:center; padding: 32px 0; font-size:1.1em;">No feedback found. <span style="font-size:1.5em;">📭</span></td></tr>';
          document.getElementById('feedbackTable').style.display = '';
        }
      } catch (err) {
        document.getElementById('feedbackMsg').textContent = 'Error loading feedback: ' + err.message;
        document.getElementById('feedbackMsg').classList.add('error');
      } finally {
        document.getElementById('loadingFeedback').style.display = 'none';
      }
    }
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"]/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }
    function logout() {
      // Same as dashboard
      localStorage.removeItem('supabase.auth.token');
      window.location.href = 'login.html';
    }
    window.onload = loadFeedback;
  </script>
</body>
</html>
