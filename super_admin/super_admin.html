<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin Dashboard - EduNest</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; margin: 0; background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh; }
    .container { max-width: 700px; margin: 48px auto 0 auto; background: #fff; border-radius: 22px; box-shadow: 0 12px 40px rgba(102,126,234,0.18), 0 2px 8px rgba(76, 61, 128, 0.09); padding: 40px 36px 36px 36px; }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; background: linear-gradient(90deg, #e0e7ff 60%, #f8fafc 100%); border-radius: 18px; box-shadow: 0 4px 24px #667eea18; padding: 28px 24px 24px 24px; position: relative; flex-wrap: wrap; }
    .header-icon { background: linear-gradient(135deg, #667eea 60%, #764ba2 100%); color: #fff; border-radius: 50%; padding: 22px; font-size: 3.2em; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px #667eea33, 0 1.5px 4px #764ba233; min-width: 80px; min-height: 80px; max-width: 90px; max-height: 90px; }
    .header-title-group { display: flex; flex-direction: column; gap: 6px; }
    .header-title { color: #2d3a4a; font-size: 2.2em; font-weight: 800; margin: 0; letter-spacing: -1.2px; line-height: 1.1; text-shadow: 0 2px 8px #e0e7ff; }
    .header-subtitle { color: #667eea; font-size: 1.13em; font-weight: 500; letter-spacing: 0.01em; margin-top: 2px; }
    .header-divider { position: absolute; left: 24px; right: 24px; bottom: 0; height: 2.5px; background: linear-gradient(90deg, #667eea22 0%, #fff 100%); border-radius: 2px; box-shadow: 0 2px 8px #667eea11; }
    .dashboard-links { display: flex; flex-direction: column; gap: 24px; margin-top: 32px; }
    .dashboard-link { background: linear-gradient(90deg, #667eea 60%, #764ba2 100%); color: #fff; border: none; border-radius: 14px; padding: 28px 32px; font-size: 1.25em; font-weight: 700; text-align: left; text-decoration: none; box-shadow: 0 2px 8px #667eea22; display: flex; align-items: center; gap: 18px; transition: background 0.2s, box-shadow 0.2s; }
    .dashboard-link:hover { background: linear-gradient(90deg, #5a67d8 60%, #6b47b6 100%); box-shadow: 0 4px 16px #667eea33; }
    .dashboard-link-icon { font-size: 2em; }
    @media (max-width: 700px) { .container { padding: 12px 2vw; } .header { flex-direction: column; align-items: flex-start; gap: 8px; } .header-title { font-size: 1.15em; } .dashboard-link { font-size: 1.08em; padding: 18px 12px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🛡️</div>
      <div class="header-title-group">
        <div class="header-title">Super Admin Dashboard</div>
        <div class="header-subtitle">Full control over all colleges and communities.</div>
      </div>
      <div class="header-divider"></div>
    </div>
    <div class="dashboard-links">
      <a href="colleges.html" class="dashboard-link"><span class="dashboard-link-icon">🏫</span> Manage Colleges</a>
      <a href="communities.html" class="dashboard-link"><span class="dashboard-link-icon">🌐</span> Manage Communities</a>
    </div>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="super_admin.js"></script>
</body>
</html>
