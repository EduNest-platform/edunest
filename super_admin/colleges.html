<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Colleges - Super Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      color: #232946;
    }
    .container {
      max-width: 900px;
      margin: 48px auto 0 auto;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(102,126,234,0.18), 0 2px 8px rgba(76, 61, 128, 0.09);
      padding: 48px 40px 40px 40px;
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      background: linear-gradient(90deg, #e0e7ff 60%, #f8fafc 100%);
      border-radius: 22px;
      box-shadow: 0 4px 24px #667eea18;
      padding: 32px 28px 28px 28px;
      position: relative;
      flex-wrap: wrap;
    }
    .header-icon {
      background: linear-gradient(135deg, #667eea 60%, #764ba2 100%);
      color: #fff;
      border-radius: 50%;
      padding: 26px;
      font-size: 3.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px #667eea33, 0 1.5px 4px #764ba233;
      min-width: 90px;
      min-height: 90px;
      max-width: 100px;
      max-height: 100px;
    }
    .header-title-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-title {
      color: #2d3a4a;
      font-size: 2.4em;
      font-weight: 900;
      margin: 0;
      letter-spacing: -1.2px;
      line-height: 1.1;
      text-shadow: 0 2px 8px #e0e7ff;
    }
    .header-subtitle {
      color: #667eea;
      font-size: 1.18em;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin-top: 2px;
    }
    .header-divider {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #667eea22 0%, #fff 100%);
      border-radius: 2px;
      box-shadow: 0 2px 8px #667eea11;
    }
    .back-btn {
      background: linear-gradient(90deg, #667eea 60%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 1.13em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px #667eea22;
      text-decoration: none;
      display: inline-block;
      letter-spacing: 0.01em;
    }
    .back-btn:hover {
      background: linear-gradient(90deg, #5a67d8 60%, #6b47b6 100%);
      box-shadow: 0 4px 16px #667eea33;
    }
    .add-college-form {
      display: flex;
      gap: 18px;
      margin-bottom: 38px;
      align-items: flex-end;
      background: linear-gradient(90deg, #e0e7ff 60%, #f8fafc 100%);
      border-radius: 16px;
      padding: 22px 22px 14px 22px;
      box-shadow: 0 2px 8px #e0e6ed;
      flex-wrap: wrap;
    }
    .add-college-form input, .add-college-form textarea {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid #bfc7e6;
      font-size: 1.13em;
      background: #f4f7fa;
      transition: border 0.2s, box-shadow 0.2s;
      flex: 1 1 320px;
      box-shadow: 0 1px 4px #e0e7ff33;
      margin-bottom: 0;
    }
    .add-college-form textarea {
      resize: vertical;
      min-height: 44px;
      max-height: 120px;
    }
    .add-college-form input:focus, .add-college-form textarea:focus {
      border: 1.5px solid #667eea;
      box-shadow: 0 0 0 2px #667eea22;
      outline: none;
    }
    .add-college-form button {
      background: linear-gradient(90deg, #667eea 60%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px 0;
      font-size: 1.18em;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(102,126,234,0.08);
      display: block;
      width: 180px;
      margin-left: auto;
      margin-right: auto;
      margin-top: 10px;
      letter-spacing: 0.01em;
    }
    .add-college-form button:hover {
      background: linear-gradient(90deg, #5a67d8 60%, #6b47b6 100%);
      box-shadow: 0 4px 16px #667eea33;
    }
    .message {
      min-height: 24px;
      margin-bottom: 22px;
      font-size: 1.13em;
      font-weight: 600;
      border-radius: 9px;
      padding: 12px 0 12px 18px;
      transition: color 0.2s, background 0.2s;
      box-shadow: 0 1px 4px #e0e7ff33;
    }
    .success {
      color: #28a745;
      background: #eafaf1;
    }
    .error {
      color: #d32f2f;
      background: #fff0f0;
    }
    .colleges-list {
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }
    .college-card {
      background: linear-gradient(120deg, #f8fafc 60%, #e0e7ff 100%);
      border-radius: 18px;
      box-shadow: 0 2px 12px #e0e6ed, 0 1px 4px #667eea11;
      padding: 26px 22px 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: box-shadow 0.2s, transform 0.2s;
      border: 1.5px solid #e0e7ff;
    }
    .college-card:hover {
      box-shadow: 0 6px 24px #667eea22, 0 2px 8px #764ba211;
      transform: translateY(-2px) scale(1.01);
      border: 1.5px solid #667eea44;
    }
    .college-title {
      font-size: 1.28em;
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 2px;
      letter-spacing: 0.01em;
    }
    .college-desc {
      color: #667eea;
      font-size: 1.08em;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .college-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .edit-btn, .delete-btn {
      border: none;
      border-radius: 9px;
      padding: 12px 0;
      width: 100px;
      font-size: 1.08em;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 4px #e0e7ff33;
      letter-spacing: 0.01em;
    }
    .edit-btn {
      background: linear-gradient(90deg, #fbbf24 60%, #f59e42 100%);
      color: #fff;
    }
    .edit-btn:hover {
      background: linear-gradient(90deg, #f59e42 60%, #fbbf24 100%);
      box-shadow: 0 4px 16px #fbbf2433;
    }
    .delete-btn {
      background: linear-gradient(90deg, #ef4444 60%, #f87171 100%);
      color: #fff;
    }
    .delete-btn:hover {
      background: linear-gradient(90deg, #f87171 60%, #ef4444 100%);
      box-shadow: 0 4px 16px #ef444433;
    }
    @media (max-width: 900px) {
      .container { padding: 18px 2vw; }
      .header { padding: 18px 2vw 18px 2vw; }
    }
    @media (max-width: 700px) {
      .container { padding: 4px 0vw; }
      .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 10px 2vw 10px 2vw; }
      .header-title { font-size: 1.15em; }
      .add-college-form {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 10px 2vw 10px 2vw;
      }
      .add-college-form input, .add-college-form textarea {
        width: 100%;
        min-width: 0;
        font-size: 1.13em;
        margin-bottom: 0;
      }
      .add-college-form button {
        width: 100%;
        margin: 0;
        font-size: 1.18em;
      }
      .college-card { padding: 14px 8px 10px 8px; }
      .colleges-list { grid-template-columns: 1fr; gap: 16px; }
      .college-actions { flex-direction: row; gap: 10px; }
      .edit-btn, .delete-btn { width: 48%; font-size: 1.08em; padding: 12px 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🏫</div>
      <div class="header-title-group">
        <div class="header-title">Manage Colleges</div>
        <div class="header-subtitle">Add, view, edit, and delete colleges.</div>
      </div>
      <div class="header-divider"></div>
    </div>
    <a href="super_admin.html" class="back-btn">← Back to Super Admin</a>
    <form class="add-college-form" onsubmit="addCollege(event)">
      <input id="collegeName" type="text" placeholder="College Name" required />
      <textarea id="collegeDesc" placeholder="Description (optional)"></textarea>
      <button type="submit"><span>➕</span> Add College</button>
    </form>
    <div id="message" class="message"></div>
    <div class="colleges-list" id="collegesList"></div>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="colleges.js"></script>
</body>
</html>
